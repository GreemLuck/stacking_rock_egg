<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gremaud.dev</title>
<meta name="description" content="Mes mini projets.">
<style>
:root {
    --bg: #ffffff;
    --bg-header: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #59636e;
    --link: #0969da;
    --card-hover: #f6f8fa;
    --tag-bg: #ddf4ff;
    --tag-text: #0969da;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0d1117;
        --bg-header: #010409;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #9198a1;
        --link: #4493f8;
        --card-hover: #161b22;
        --tag-bg: #121d2f;
        --tag-text: #4493f8;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

header {
    background-color: var(--bg-header);
    border-bottom: 1px solid var(--border);
    padding: 16px;
}
header .inner {
    max-width: 1012px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    font-weight: 600;
}
header .logo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: var(--text);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

main {
    max-width: 1012px;
    margin: 0 auto;
    padding: 32px 16px;
    display: flex;
    gap: 32px;
}

.profile { width: 256px; flex-shrink: 0; }
.avatar {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: linear-gradient(135deg, #8b6f47, #d9c7a7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 96px;
}
.profile h1 { font-size: 24px; margin: 16px 0 0; font-weight: 600; line-height: 1.25; }
.profile .handle { font-size: 20px; color: var(--text-muted); font-weight: 300; }
.profile p { margin: 16px 0 0; }

.projects { flex: 1; min-width: 0; }
.tabs {
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
}
.tabs span {
    display: inline-block;
    padding: 8px 16px;
    border-bottom: 2px solid #fd8c73;
    font-weight: 600;
}
.tabs .count {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 2em;
    background-color: var(--border);
    font-size: 12px;
    font-weight: 500;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}
.card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    color: var(--text);
}
.card:hover { background-color: var(--card-hover); text-decoration: none; }
.card .title { display: flex; align-items: center; gap: 8px; }
.card .name { color: var(--link); font-weight: 600; }
.card:hover .name { text-decoration: underline; }
.card .badge {
    border: 1px solid var(--border);
    border-radius: 2em;
    padding: 0 7px;
    font-size: 12px;
    color: var(--text-muted);
}
.card .desc { color: var(--text-muted); font-size: 12px; margin: 8px 0 16px; flex: 1; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.card .tag {
    background-color: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 2em;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 500;
    line-height: 22px;
}
.card .meta { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.lang-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

footer {
    max-width: 1012px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
}

@media (max-width: 768px) {
    main { flex-direction: column; gap: 24px; }
    .profile { width: 100%; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .avatar { width: 80px; font-size: 40px; }
    .profile h1 { margin: 0; }
    .profile p { width: 100%; margin: 0; }
    .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
    <div class="inner">
        <div class="logo">G</div>
        <span>gremaud.dev</span>
    </div>
</header>

<main>
    <aside class="profile">
        <div class="avatar">🥚</div>
        <div>
            <h1>Gremaud</h1>
            <div class="handle">gremaud.dev</div>
        </div>
        <p>Une petite collection de mini projets.</p>
    </aside>

    <section class="projects">
        <div class="tabs">
            <span>Projets <span class="count" id="project-count"></span></span>
        </div>

        <div class="grid" id="project-grid">
            <a class="card" href="egg-calculator/">
                <div class="title">
                    <span class="name">egg-calculator</span>
                    <span class="badge">Public</span>
                </div>
                <p class="desc">Calcule le rayon de chaque étage d'un oeuf (ou d'une sphère) en pierres empilées.</p>
                <div class="tags">
                    <span class="tag">calculateur</span>
                    <span class="tag">empilement</span>
                </div>
                <div class="meta">
                    <span class="lang-dot" style="background-color:#f1e05a"></span>
                    JavaScript
                </div>
            </a>
        </div>
    </section>
</main>

<footer>&copy; <span id="year"></span> gremaud.dev</footer>

<script>
document.getElementById("project-count").textContent = document.querySelectorAll("#project-grid .card").length;
document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
