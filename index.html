<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gremaud.dev</title>
<meta name="description" content="Mes mini projets.">
<style>
:root {
    --bg: #ffffff;
    --bg-header: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #59636e;
    --link: #0969da;
    --card-hover: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0d1117;
        --bg-header: #010409;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #9198a1;
        --link: #4493f8;
        --card-hover: #161b22;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
}

header {
    background-color: var(--bg-header);
    border-bottom: 1px solid var(--border);
    padding: 16px;
}
header .inner {
    max-width: 1012px;
    margin: 0 auto;
    font-size: 16px;
    font-weight: 600;
}

main {
    max-width: 1012px;
    margin: 0 auto;
    padding: 32px 16px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
}
.card {
    display: block;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    color: var(--text);
    text-decoration: none;
}
.card:hover { background-color: var(--card-hover); }
.card img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-bottom: 1px solid var(--border);
}
.card .name {
    display: block;
    padding: 10px 12px;
    color: var(--link);
    font-weight: 600;
}
.card:hover .name { text-decoration: underline; }
</style>
</head>
<body>
<header>
    <div class="inner">gremaud.dev</div>
</header>

<main>
    <div class="grid">
        <a class="card" href="egg-calculator/">
            <img src="egg-calculator/oeuf.webp" alt="">
            <span class="name">Calculateur d'oeuf</span>
        </a>
        <a class="card" href="secret-santa/">
            <img src="secret-santa/preview.svg" alt="">
            <span class="name">Secret Santa</span>
        </a>
    </div>
</main>
</body>
</html>
